name: Bug Report
description: Report a bug in ADotFiles
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in the details below.
  - type: input
    id: version
    attributes:
      label: ADotFiles Version
      description: "Run `adot version` or check `adotstatus`"
      placeholder: "1.2.0"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac Chip
      options:
        - Apple Silicon (M1/M2/M3/M4)
        - Intel
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "Output of `adot doctor`"
      render: shell
    validations:
      required: false
